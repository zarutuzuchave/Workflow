<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow - Busca Inteligente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="navbar">
        <a href="main.html" class="logo-link">
            <img src="logo.svg" alt="Workflow Logo" height="30px">
        </a>
        <div class="nav-links" style="display: flex; align-items: center; gap: 12px;">
            <a id="Home" href="main.html">Página Inicial</a>
            <a id="Post" href="user.html">Usuários</a>
            <a id="Comments" href="comments.html">Comentários</a>
            <a id="filter" href="filter.html" class="active">🔍</a>
            <a id="create-btn" href="#" onclick="openCreateModal(); return false;" style="font-weight: bold; font-size: 18px;" title="Criar Post / Foto">+</a>
            <a id="Account" href="account.html" style="padding: 4px; background: none;">
                <img id="nav-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="Perfil" style="width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--yt-border);" />
            </a>
        </div>
    </nav>
    <main class="container">
        <div id="filter-content">
            <h1>Busca Inteligente</h1>
            <p class="subtitle">Busque por nome, ID, email, ID do post ou foto em um único campo com autocomplete baseado no sistema.</p>
            
            <div class="search-controls">
                <div class="search-group">
                    <input type="text" id="global-search" placeholder="Digite para buscar (nome, email, ID, post, foto)..." list="search-suggestions" autocomplete="off" />
                    <datalist id="search-suggestions"></datalist>
                </div>
            </div>

            <div id="filter-stats" class="stats-box"></div>

            <div class="content-list" id="filter-results-container">
                <!-- Resultados da busca aparecerão aqui -->
            </div>
        </div>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
